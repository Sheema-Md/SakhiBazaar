<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product | Sakhi Bazaar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2, h3 {
      color: #af4c98;
    }

    h2 i, h3 i {
      margin-right: 10px;
    }

    .section {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    .image-preview {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .image-preview img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 5px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .publish {
      background-color: #af4c8e;
      color: white;
    }

    .draft {
      background-color: #f0ad4e;
      color: white;
    }

    button i {
      margin-right: 8px;
    }

    small {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>

    <!-- Basic Product Info -->
    <div class="section">
      <h3><i class="fas fa-box-open"></i> Basic Product Info</h3>

      <label for="product-name">Product Name:</label>
      <input type="text" id="product-name" placeholder="Enter product name">

      <label for="category">Category:</label>
      <select id="category">
        <option value="">Select category</option>
        <option value="clothing">Clothing</option>
        <option value="jewelry">Jewelry</option>
        <option value="home-decor">Home Decor</option>
      </select>

      <label for="price">Price (₹):</label>
      <input type="number" id="price" placeholder="Enter product price">

      <label for="stock">Stock Quantity:</label>
      <input type="number" id="stock" placeholder="Enter available stock">
    </div>

    <!-- Product Image Upload -->
    <div class="section">
      <h3><i class="fas fa-image"></i> Product Image Upload</h3>
      <input type="file" id="product-images" accept="image/*" multiple>
      <small>You can upload up to 3 images (jpg/png only)</small>

      <!-- Image Preview Container -->
      <d+iv class="image-preview" id="image-preview"></div>
    </div>

    <!-- Product Description -->
    <div class="section">
      <h3><i class="fas fa-align-left"></i> Product Description</h3>
      <textarea placeholder="Describe your product..."></textarea>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="publish"><i class="fas fa-upload"></i> Publish Product</button>
      <button class="draft"><i class="fas fa-save"></i> Save as Draft</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('product-images');
    const previewContainer = document.getElementById('image-preview');

    fileInput.addEventListener('change', function () {
      previewContainer.innerHTML = ''; // Clear previous previews
      const files = Array.from(fileInput.files).slice(0, 3); // Limit to 3 images

      files.forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            previewContainer.appendChild(img);
          };
          reader.readAsDataURL(file);
        }
      });
    });
  </script>
</body>
</html>
