<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = document.getElementById('productImage');
        img.src = reader.result;
        img.classList.remove('hidden');
        document.getElementById('uploadLabel').classList.add('hidden');
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    function toggleDeliveryTime(select) {
      const deliveryField = document.getElementById('deliveryTimeField');
      if (select.value === 'Pre-order') {
        deliveryField.classList.remove('hidden');
      } else {
        deliveryField.classList.add('hidden');
      }
    }

    // Ensure correct field visibility on page load
    window.onload = function () {
      const orderTypeSelect = document.querySelector('select[name="order_type"]');
      toggleDeliveryTime(orderTypeSelect);
    };
  </script>
</head>
<body class="bg-purple-50 p-8">
  <form method="POST" enctype="multipart/form-data" action="save_product.php" class="max-w-3xl mx-auto bg-white shadow-xl p-6 rounded-xl space-y-4">
    <input type="hidden" name="id" value="29">

    <div class="flex gap-6">
      <!-- Image -->
      <div class="relative">
        <input type="file" name="prod-img" id="imageInput" class="absolute w-full h-full opacity-0 cursor-pointer" onchange="previewImage(event)">
        <img id="productImage" src="uploads/1748418384_rainforest.jpg" class="w-32 h-32 object-cover rounded-xl border" />
      </div>

      <div class="flex-1 space-y-4">
        <div>
          <label class="block text-purple-800 font-medium">Product Name</label>
          <input type="text" name="name" value="Salwar suit" class="w-full p-2 border rounded bg-purple-50">
        </div>

        <div>
          <label class="block text-purple-800 font-medium">Category</label>
          <select name="category" class="w-full p-2 border rounded bg-purple-50">
            <option value='👗 Clothing' selected>👗 Clothing</option>
            <option value='👜 Accessories'>👜 Accessories</option>
            <option value='🪡 Handicrafts'>🪡 Handicrafts</option>
            <option value='🏠 Home Decor'>🏠 Home Decor</option>
            <option value='❔Other'>❔Other</option>
          </select>
        </div>

        <div>
          <label class="block text-purple-800 font-medium">Order Type</label>
          <select name="order_type" class="w-full p-2 border rounded bg-purple-50" onchange="toggleDeliveryTime(this)">
            <option value="Immediate" selected>Immediate</option>
            <option value="Pre-order">Pre-order</option>
          </select>
        </div>

        <!-- Conditional field for delivery time -->
        <div id="deliveryTimeField" class="hidden">
          <label class="block text-purple-800 font-medium">Delivery Time (in days)</label>
          <input type="number" name="delivery_time" min="1" class="w-full p-2 border rounded bg-purple-50" placeholder="e.g. 7">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-purple-800 font-medium">Price</label>
        <input type="text" name="price" value="1000.00" class="w-full p-2 border rounded bg-purple-50">
      </div>

      <div>
        <label class="block text-purple-800 font-medium">Stock Status</label>
        <select name="stock" class="w-full p-2 border rounded bg-purple-50">
          <option value="In Stock">In Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>

      <div>
        <label class="block text-purple-800 font-medium">Quantity</label>
        <input type="number" name="quantity" value="6" class="w-full p-2 border rounded bg-purple-50">
      </div>

      <div>
        <label class="block text-purple-800 font-medium">Color</label>
        <input type="text" name="color" value="Blue" class="w-full p-2 border rounded bg-purple-50">
      </div>

      <div>
        <label class="block text-purple-800 font-medium">Material</label>
        <input type="text" name="material" value="Cotton" class="w-full p-2 border rounded bg-purple-50">
      </div>

      <div>
        <label class="block text-purple-800 font-medium">Sizes (comma separated)</label>
        <input type="text" name="size" value="S,M,L,XL" class="w-full p-2 border rounded bg-purple-50">
      </div>
    </div>

    <div>
      <label class="block text-purple-800 font-medium">Description</label>
      <textarea name="description" rows="4" class="w-full p-3 border rounded bg-purple-50">Embroidered floral salwar suit</textarea>
    </div>

    <div class="flex justify-between border-t pt-4">
      <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700">Save Changes</button>
      <a href="delete_product.php?id=29" onclick="return confirm('Are you sure?')" class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-600">Delete Product</a>
    </div>
  </form>
</body>
</html>
