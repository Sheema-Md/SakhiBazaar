<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart - Sakhi Bazaar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f3e8ff; padding-bottom: 80px; font-family: 'Segoe UI', sans-serif; }
    .product-img { width: 80px; border-radius: 8px; }
    .seller-bar, .wishlist-link, .price-row { font-size: 14px; color: #5a2d82; }
    .summary-box { background: #e8d1ff; border-radius: 6px; padding: 10px; margin-top: 10px; color: #5c2675; }
    .sticky-bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #ffffff;
      border-top: 2px solid #d3bff5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }
    .btn-primary {
      background-color: #6f42c1;
      border-color: #6f42c1;
    }
    .btn-outline-danger {
      border-color: #9333ea;
      color: #9333ea;
    }
    .btn-outline-danger:hover {
      background-color: #9333ea;
      color: white;
    }
  </style>
</head>
<body>

<!-- Cart Items -->
<div class="container pt-3">
  <!-- Item Block -->
  <div class="cart-item mb-3 border-bottom pb-2">
    <div class="d-flex justify-content-between seller-bar">
      <span>Sold by: <strong>JINESH_SHOP</strong></span>
      <span class="text-success">Free Delivery</span>
    </div>
    <div class="d-flex align-items-center mt-2">
      <img src="https://via.placeholder.com/100x100.png?text=Item" class="product-img me-3" />
      <div>
        <strong>Trendy Chopping Board</strong><br />
        <small>₹131 <del class="text-muted">₹135</del> <span class="text-success">3% Off</span></small><br />
        <small class="text-muted">Only wrong/defect item returns</small><br />
        <small>Size: Free Size • Qty: 1</small>
      </div>
      <div class="ms-auto">
        <i class="fas fa-chevron-right text-secondary" data-bs-toggle="modal" data-bs-target="#modifyModal" style="cursor:pointer;"></i>
      </div>
    </div>
    <div class="mt-2">
      <button class="btn btn-sm btn-outline-danger remove-btn">
        <i class="fas fa-trash-alt"></i> Remove
      </button>
    </div>
  </div>

  <!-- Wishlist Preview -->
  <div class="wishlist-link d-flex justify-content-between align-items-center border-top border-bottom py-2">
    <div><i class="fas fa-heart me-1 text-danger"></i> Wishlist</div>
    <i class="fas fa-chevron-right text-secondary"></i>
  </div>

  <!-- Price Details -->
  <div class="mt-3" id="price-section">
    <h6 class="text-dark">Price Details (1 Item)</h6>
    <div class="d-flex justify-content-between price-row">
      <span>Total Product Price</span><span>₹131</span>
    </div>
    <div class="d-flex justify-content-between price-row">
      <span class="text-success">Total Discounts</span><span class="text-success">– ₹4</span>
    </div>
    <hr />
    <div class="d-flex justify-content-between fw-bold text-dark">
      <span>Order Total</span><span>₹127</span>
    </div>
    <div class="summary-box d-flex align-items-center mt-2">
      <i class="fas fa-tags me-2"></i> Yay! Your total discount is ₹4
    </div>
  </div>
</div>

<!-- Sticky Footer -->
<div class="sticky-bottom-bar">
  <div>
    <div class="fw-bold text-dark">₹127</div>
    <a href="#" class="text-decoration-underline small text-muted">VIEW PRICE DETAILS</a>
  </div>
  <button class="btn btn-primary rounded-pill px-4">Continue</button>
</div>

<!-- Modal for Size & Qty -->
<div class="modal fade" id="modifyModal" tabindex="-1" aria-labelledby="modifyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-dark"><i class="fas fa-pen-to-square me-2"></i>Modify Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Size Selection -->
        <div class="mb-3">
          <label for="sizeSelect" class="form-label">Select Size</label>
          <select class="form-select" id="sizeSelect">
            <option selected>Free Size</option>
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
          </select>
        </div>
        <!-- Quantity Selection -->
        <div class="mb-3">
          <label for="qtySelect" class="form-label">Select Quantity</label>
          <input type="number" id="qtySelect" class="form-control" value="1" min="1" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- JS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Remove button logic
  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      const item = this.closest('.cart-item');
      item.remove();

      // Optional: Hide price section if no items left
      if (document.querySelectorAll('.cart-item').length === 0) {
        document.getElementById('price-section').innerHTML = '<div class="text-center text-muted">Your cart is empty.</div>';
        document.querySelector('.sticky-bottom-bar').style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
