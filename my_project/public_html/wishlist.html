<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyShop - Wishlist Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f3e8ff; }
    .wishlist-img { max-width: 100px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="#">🛍️ MyShop</a>
  <div>
    <span class="text-white">❤️ Wishlist</span>
  </div>
</nav>

<div class="container my-4">
  <!-- Wishlist Section Only -->
  <div id="wishlist-section">
    <h4>Wishlist ❤️</h4>
    <ul id="wishlist-items" class="list-group" style="max-height: 500px; overflow-y:auto;"></ul>
  </div>
</div>

<script>
  const products = [
    { id: 1, name: "Red Kurti", price: 899, image: "https://via.placeholder.com/150?text=Kurti" },
    { id: 2, name: "Blue Dupatta", price: 299, image: "https://via.placeholder.com/150?text=Dupatta" },
    { id: 3, name: "Gold Earrings", price: 499, image: "https://via.placeholder.com/150?text=Earrings" },
    { id: 4, name: "Black Jutti", price: 599, image: "https://via.placeholder.com/150?text=Jutti" }
  ];

  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  function saveWishlist() {
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
  }

  function renderWishlist() {
    const container = document.getElementById("wishlist-items");
    container.innerHTML = "";
    if (wishlist.length === 0) {
      container.innerHTML = '<li class="list-group-item text-center text-muted">Wishlist is empty</li>';
      return;
    }
    wishlist.forEach(id => {
      const p = products.find(prod => prod.id === id);
      if (p) {
        container.innerHTML += `
          <li class="list-group-item d-flex align-items-center justify-content-between">
            <img src="${p.image}" class="wishlist-img me-3" alt="${p.name}" />
            <div>
              <strong>${p.name}</strong><br>₹${p.price}
            </div>
            <button class="btn btn-sm btn-danger" onclick="toggleWishlist(${p.id})">Remove</button>
          </li>
        `;
      }
    });
  }

  function toggleWishlist(id) {
    if (wishlist.includes(id)) {
      wishlist = wishlist.filter(i => i !== id);
    }
    saveWishlist();
    renderWishlist();
  }

  renderWishlist();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
